name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_DB: ai_helpdesk_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U helpdesk -d ai_helpdesk_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_PORT: '5434'
      POSTGRES_PASSWORD: ci-isolated-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.test.txt
      - run: python -m pytest backend/tests -q --tb=short
  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_DB: ai_helpdesk_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U helpdesk -d ai_helpdesk_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_PORT: '5434'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r ../backend/requirements.test.txt
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report
          path: frontend/test-results/
